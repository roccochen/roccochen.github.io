# Site settings
title: Craft Bench
SEOTitle: Craft Bench
header-img: img/home-bg.jpg
description: "Tools, experiments and notes on building things."
keyword: ""
url: "https://roccochen.github.io"      # your host, for absolute URL
baseurl: ""                             # user site lives at the domain root


# SNS settings
RSS: false
#weibo_username:    false
#zhihu_username:    false
github_username:    Roccochen
#twitter_username:  huxpro
#facebook_username:  huxpro



# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md","_site"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Gems
# from PR#40, to support local preview for Jekyll 3.0
gems: [jekyll-paginate]



# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# Disqus settings
#disqus_username: _your_disqus_short_name_


# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: ""           # left empty on purpose: no personal bio
sidebar-avatar: ""                      # left empty on purpose: no avatar



# Featured Tags
featured-tags: true                     # whether or not using Feature-Tags
featured-condition-size: 1              # A tag will be featured if the size of it is more than this condition value



# Published projects / live pages
# Every entry below shows up as a card on the homepage and as a link in the sidebar.
# url: absolute (https://...) or root-relative (/some-repo/)
projects:
  - name: "流放做装台"
    tag: "Web App"
    status: "Live"
    url: "https://roccochen.github.io/poe-craft-lab-site/"
    desc: "Path of Exile 1 / 2 装备制作助手：选底子、定目标词缀，再按成本与成功率推荐下一步。纯前端运行，无需安装。"
    repo: "https://github.com/roccochen/poe-craft-lab-site"
    accent: "#c9a227"
  - name: "Blog"
    tag: "Writing"
    status: "Archive"
    url: "/"
    desc: "长期零散的技术与设计笔记，按标签归档。"
    accent: "#5b8def"



